<div class="ambient" aria-hidden="true">
  <img [src]="theme() === 'spotify'
    ? '/images/listener-green.png'
    : '/images/listener-red.png'"
         alt=""/>
</div>

<header class="app-header">
  <a class="brand" href="/" aria-label="MusicSwapix - início">
    <span class="brand-mark" aria-hidden="true">↗</span>
    MusicSwapix
  </a>

  <nav class="app-nav" aria-label="Navegação principal">
    <a
      routerLink="/converter"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      Converter
    </a>

    <a
      routerLink="/historico"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      Histórico
    </a>
  </nav>
</header>

<main class="app-content">
  <section class="hero" aria-labelledby="hero-title">
    <p class="eyebrow">Spotify → YouTube</p>

    <h1 id="hero-title">
      O mesmo som.<br />
      <span>Um novo lugar.</span>
    </h1>

    <p class="hero-description">
      Leve suas músicas favoritas com você. Confira as correspondências
      e escolha o que acontece depois.
    </p>

    <div class="accent-line" aria-hidden="true"></div>
  </section>

  <div class="theme-options" role="group" aria-label="Tema visual">
    <button
      type="button"
      [attr.aria-pressed]="theme() === 'youtube'"
      (click)="theme.set('youtube')"
    >
      Tema YouTube
    </button>

    <button
      type="button"
      [attr.aria-pressed]="theme() === 'spotify'"
      (click)="theme.set('spotify')"
    >
      Tema Spotify
    </button>
  </div>

  <router-outlet />
</main>
